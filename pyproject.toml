[project]
name = "keitaro-campaign-manager"
version = "0.1.0"
description = "Локальная панель управления кампаниями Keitaro"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3", "pycountry>=24.6", 
]
[dependency-groups]
browser = [
    "pytest-playwright>=0.7,<1",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
