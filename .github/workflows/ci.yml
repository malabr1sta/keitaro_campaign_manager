name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group browser
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run --group browser playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 uv run --group browser pytest tests/browser -q
      - run: docker build --target base -t keitaro-wrapper:test .
